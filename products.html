<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop | Yadawi</title>
  <meta name="description" content="Browse, search and filter handmade products.">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- The header and footer are filled in by js/app.js -->
  <header id="site-header"></header>

  <main class="container">
    <h1>Shop</h1>
    <div class="shop">

      <!-- Search and filters -->
      <aside class="card filters">
        <form id="filter-form">
          <div class="field">
            <label for="search">Smart search</label>
            <input type="search" id="search" placeholder="e.g. candle under 60">
            <p class="muted small">Try: "rose candle", "gifts under 100", "jewelry 50 to 150", "bag in stock"</p>
          </div>
          <div class="field">
            <label for="category">Category</label>
            <select id="category">
              <option value="">All categories</option>
            </select>
          </div>
          <div class="field">
            <label>Price range (AED)</label>
            <div class="price-range">
              <input type="number" id="min-price" min="0" placeholder="Min" aria-label="Minimum price">
              <input type="number" id="max-price" min="0" placeholder="Max" aria-label="Maximum price">
            </div>
          </div>
          <div class="field">
            <label class="check"><input type="checkbox" id="in-stock"> In stock only</label>
          </div>
          <button class="btn btn-block" type="submit">Search</button>
          <button class="btn btn-outline btn-block" type="button" id="clear-filters" style="margin-top:8px">Clear</button>
        </form>
      </aside>

      <!-- Results -->
      <section>
        <div class="toolbar">
          <span id="result-count" class="muted">Loading...</span>
          <div>
            <label for="sort" class="hidden">Sort</label>
            <select id="sort" aria-label="Sort products">
              <option value="newest">Newest first</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
              <option value="name">Name: A to Z</option>
            </select>
          </div>
        </div>
        <div class="chips" id="chips"></div>
        <div class="product-grid" id="product-grid"></div>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <!-- Supabase library first, then our own scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
