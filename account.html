<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My account | Yadawi</title>
  <meta name="description" content="Your profile and order history.">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- The header and footer are filled in by js/app.js -->
  <header id="site-header"></header>

  <main class="container">
    <h1>My account</h1>
    <div class="two-col">
      <section class="card">
        <h2>My orders</h2>
        <!-- Filled from the orders table. RLS returns only this user's orders. -->
        <div id="orders"><p class="muted">Loading orders...</p></div>
      </section>

      <aside class="card">
        <h2>Profile</h2>
        <div id="message"></div>
        <form id="profile-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" disabled>
          </div>
          <div class="field">
            <label for="full-name">Full name</label>
            <input type="text" id="full-name" required>
          </div>
          <div class="field">
            <label for="phone">Mobile number</label>
            <input type="tel" id="phone">
          </div>
          <div class="field">
            <label for="address">Delivery address</label>
            <textarea id="address" rows="3"></textarea>
          </div>
          <button class="btn btn-block" type="submit">Save profile</button>
        </form>
      </aside>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <!-- Supabase library first, then our own scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app.js"></script>
  <script src="js/confirmation.js"></script>
  <script src="js/account.js"></script>
</body>
</html>
