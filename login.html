<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Yadawi</title>
  <meta name="description" content="Log in to your Yadawi account.">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- The header and footer are filled in by js/app.js -->
  <header id="site-header"></header>

  <main class="container">
    <div class="card form-card">
      <h1>Log in</h1>
      <div id="message"></div>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-block" type="submit">Log in</button>
      </form>
      <p class="center small" style="margin-top:16px">New here? <a href="register.html">Create an account</a></p>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <!-- Supabase library first, then our own scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
