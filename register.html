<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Yadawi</title>
  <meta name="description" content="Create a Yadawi account.">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- The header and footer are filled in by js/app.js -->
  <header id="site-header"></header>

  <main class="container">
    <div class="card form-card">
      <h1>Create an account</h1>
      <div id="message"></div>
      <form id="register-form" novalidate>
        <div class="field">
          <label for="full-name">Full name</label>
          <input type="text" id="full-name" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="new-password" minlength="8" required>
          <p class="muted small">At least 8 characters.</p>
        </div>
        <div class="field">
          <label for="confirm-password">Confirm password</label>
          <input type="password" id="confirm-password" autocomplete="new-password" required>
        </div>
        <button class="btn btn-block" type="submit">Register</button>
      </form>
      <p class="center small" style="margin-top:16px">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <!-- Supabase library first, then our own scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
