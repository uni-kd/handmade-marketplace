<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart | Yadawi</title>
  <meta name="description" content="Your shopping cart.">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- The header and footer are filled in by js/app.js -->
  <header id="site-header"></header>

  <main class="container">
    <h1>Your cart</h1>
    <div id="message"></div>
    <div class="two-col">
      <!-- Cart items are read from localStorage -->
      <section class="card" id="cart-items"></section>

      <aside class="card" id="cart-summary">
        <h2>Summary</h2>
        <div class="summary-row"><span>Items</span><span id="summary-count">0</span></div>
        <div class="summary-row"><span>Delivery (UAE)</span><span>Free</span></div>
        <div class="summary-row"><span class="muted small">Includes 5% VAT</span><span class="muted small" id="summary-vat">AED 0.00</span></div>
        <div class="summary-row total"><span>Total</span><span id="summary-total">AED 0.00</span></div>
        <a class="btn btn-block" id="checkout-link" href="checkout.html" style="margin-top:16px">Proceed to checkout</a>
        <button class="btn btn-outline btn-block" id="clear-cart" type="button" style="margin-top:8px">Empty cart</button>
      </aside>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <!-- Supabase library first, then our own scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
